---
layout: default
---
<!-- page.html -->
        <div class="post">

          <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-description">{{ page.description }}</p>

            {%- if page.github or page.website or page.paper %}
            <div class="page-links">
              {%- if page.github %}<a class="page-link-btn" href="{{ page.github }}">code</a>{% endif %}
              {%- if page.website %}<a class="page-link-btn" href="{{ page.website }}">website</a>{% endif %}
              {%- if page.paper %}<a class="page-link-btn" href="{{ page.paper }}">paper</a>{% endif %}
            </div>
            {%- endif %}
          </header>

          <article>
            {{ content }}
          </article>

        </div>
